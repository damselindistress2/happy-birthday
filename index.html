<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Birthday Desktop</title>

    <link href="https://fonts.googleapis.com/css2?family=VT323&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="desktop">

    <div class="gradient"></div>


    <div class="desktop-icons">

        <div class="desktop-icon folder">
            <img src="folder.png">
            <span>Birthday</span>
        </div>

        <div class="desktop-icon winamp">
            <img src="win.png">
            <span>Winamp</span>
        </div>

        <div class="desktop-icon photos" onclick="openPhotos()">
            <img src="photos.png">
            <span>Photos</span>
        </div>

        <div class="desktop-icon saves" onclick="openSaves()">
            <img src="saves.png">
            <span>Saves</span>
        </div>

        <div class="desktop-icon internet" onclick="openInternet()">
            <img src="internet.png">
            <span>Internet</span>
        </div>

        <div class="desktop-icon recycle" onclick="openRecycle()">
            <img src="bin.png">
            <span>Recycle Bin</span>
        </div>

    </div>

    <div class="taskbar">

        <div class="start-button" onclick="startParty()">
            <img src="cloud.png">
            <span>START</span>
        </div>

        <div class="date">
            12-Aug-1996&nbsp;&nbsp;03:45 PM
        </div>

    </div>


    <div class="party-window" id="partyWindow">

        <div class="party-title">
            Start
        </div>

        <div class="party-message">
            Let's get this party started! 🎉
        </div>

        <button onclick="closeParty()">
            OK
        </button>

    </div>

    <div class="photos-window" id="photosWindow">

        <div class="photos-title">
            Photos
        </div>


        <div class="photo-viewer">

            <img id="currentPhoto" src="chess.png">

        </div>


        <div class="photo-controls">

            <button onclick="nextPhoto()">
                ◀
            </button>

            <button onclick="prevPhoto()">
                ▶
            </button>

            <button onclick="closePhotos()">
                Close
            </button>

        </div>

    </div>


    <div class="recycle-window" id="recycleWindow">

        <div class="recycle-title">
            Recycle Bin
        </div>

        <div class="recycle-content">

            <div class="file-header">
                <span>Name</span>
                <span>Size</span>
            </div>

            <div class="file-row">
                <span>bad_jokes.zip</span>
                <span>999 KB</span>
            </div>

            <div class="file-row">
                <span>embarrassing_photos.zip</span>
                <span>2.4 MB</span>
            </div>

            <div class="file-row">
                <span>taxes_final_FINAL2.doc</span>
                <span>12 KB</span>
            </div>

        </div>

        <button onclick="closeRecycle()">
            Close
        </button>

    </div>

    <div class="saves-window" id="savesWindow">

        <div class="saves-title">
            Saves
        </div>


        <div class="saves-content">

            <div class="file-header">
                <span>Name</span>
                <span>Size</span>
            </div>


            <div class="file-row">
                <span>save1.dat</span>
                <span>512 KB</span>
            </div>


            <div class="file-row">
                <span>save2.dat</span>
                <span>768 KB</span>
            </div>


            <div class="file-row">
                <span>birthday.sav</span>
                <span>4.2 MB</span>
            </div>

        </div>


        <button onclick="closeSaves()">
            Close
        </button>

    </div>

</div>

<script>

function startParty() {
    document.getElementById("partyWindow").style.display = "block";
}

function closeParty() {
    document.getElementById("partyWindow").style.display = "none";
}

function openRecycle() {
    document.getElementById("recycleWindow").style.display = "flex";
}

function closeRecycle() {
    document.getElementById("recycleWindow").style.display = "none";
}

function openInternet() {
    window.open(
        "https://www.google.com/search?q=how+to+stop+aging",
        "_blank"
    );
}

function openSaves(){
    document.getElementById("savesWindow").style.display = "flex";
}


function closeSaves(){
    document.getElementById("savesWindow").style.display = "none";
}

let photos = [
    "chess.png",
    "radio.png",
    "video_games.png",
    "bday.png",
    "fish.png"
];

let currentPhotoIndex = 0;


function openPhotos(){

    document.getElementById("photosWindow").style.display="flex";

}


function closePhotos(){

    document.getElementById("photosWindow").style.display="none";

}


function nextPhoto(){

    currentPhotoIndex++;

    if(currentPhotoIndex >= photos.length){

        currentPhotoIndex = 0;

    }

    document.getElementById("currentPhoto").src =
    photos[currentPhotoIndex];

}

function prevPhoto(){

    currentPhotoIndex--;

    if(currentPhotoIndex < 0){

        currentPhotoIndex = photos.length - 1;

    }

    document.getElementById("currentPhoto").src =
        photos[currentPhotoIndex];

}

</script>

</body>

</html>
