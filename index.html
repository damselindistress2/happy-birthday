<!DOCTYPE html>
<html>

<head>
    <title>Birthday Desktop</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>


<body>
<div class="desktop">
    <div class="gradient"></div>
    <div class="desktop-icons">
        <div class="desktop-icon folder">
            <img src="folder.png">
            <span>Birthday</span>
        </div>

        <div class="desktop-icon winamp">
            <img src="win.png">
            <span>Winamp</span>
        </div>

        <div class="desktop-icon recycle">
            <img src="bin.png">
            <span>Recycle Bin</span>
        </div>

        <div class="desktop-icon photos">
            <img src="photos.png">
            <span>Photos</span>
        </div>

        <div class="desktop-icon saves">
            <img src="saves.png">
            <span>Saves</span>
        </div>

        <div class="desktop-icon internet">
            <img src="internet.png">
            <span>Internet</span>
        </div>

    </div>

    <div class="taskbar">

        <div class="start-button">
            <img src="cloud.png">
            <span>START</span>
        </div>

        <div class="date">
            12-Aug-2026 03:45 PM
        </div>
    </div>
</div>

</body>

</html>
